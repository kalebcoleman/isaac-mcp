[package]
# Semantic Versioning — https://semver.org/
version = "0.1.0"
authors = ["Aldrin Inbaraj"]
title = "isaac.mcp.bridge"
description = "Generic MCP socket bridge: owner/namespace tool registry, NDJSON-over-TCP protocol, main-thread dispatch. One bridge, one port, per Kit process."
readme = "docs/README.md"
repository = ""
category = "Internal"
keywords = ["kit", "mcp", "bridge", "socket"]
changelog = "docs/CHANGELOG.md"

[dependencies]
# REQUIRED — provides run_coroutine for the socket-thread -> main-thread hop.
"omni.kit.async_engine" = {}

# Public python module: importable as `import isaac_mcp_bridge` (dots are illegal in module names).
[[python.module]]
name = "isaac_mcp_bridge"

# Bridge settings: every knob's identity (env override + settings keys +
# precedence) is defined once in isaac_mcp_bridge/knobs.py; scripts/install.py
# writes the persistent forms. See docs/configuration.md in the repository.
