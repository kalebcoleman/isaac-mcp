[package]
# Semantic Versioning is used: https://semver.org/
version = "1.0.0"

# Lists people or organizations that are considered the "authors" of the package.
authors = ["Kaleb Coleman", "Aldrin Inbaraj"]

# The title and description fields are primarily for displaying extension info in UI
title = "ur5e-dt"
description="UR5e Digital Twin extension with MCP integration for robotic simulation control."

# Path (relative to the root) or content of readme markdown file for UI.
readme  = "docs/README.md"

# URL of the extension source repository.
repository = ""

# One of categories for UI.
category = "Simulation"

# Keywords for the extension
keywords = ["ur5e", "digital twin", "mcp"]

[dependencies]
# Generic MCP socket bridge — loaded first so `from isaac_mcp_bridge import ...` works
# and get_mcp_bridge() is available in on_startup. It lives in this repository at exts/isaac.mcp.bridge.
"isaac.mcp.bridge" = {}

# Public Python module: import ur5e_dt
[[python.module]]
name = "ur5e_dt"
