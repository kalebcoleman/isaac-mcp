[project]
name = "isaac-mcp"
version = "0.2.0"
description = "MCP server for Isaac Sim and Isaac Lab with desktop screen capture"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    # Floor 1.12.4: the lowest version the test suite has been run on (the locked version).
    # Tool annotations (ToolAnnotations, FastMCP.tool(annotations=)) need mcp>=1.7.
    # Upper bound <2: mcp 2 renamed FastMCP to MCPServer and removed
    # `mcp.server.fastmcp`, which isaac_mcp/server.py imports.
    "mcp[cli]>=1.12.4,<2",
    # Host-side screen tools (isaac_mcp/screen.py).
    "mss>=10.0",
    "pillow>=10.0",
    "python-xlib>=0.33",
    "imageio-ffmpeg>=0.5",
]

# The doorway's own test interpreter (`pip install -e '.[test]'`); the platform
# verifier refuses an interpreter that cannot import pytest.
[project.optional-dependencies]
test = [
    "pytest",
]
# Isaac Lab tool pack: TensorBoard event-file readout (isaaclab__metrics_*, isaaclab__tensorboard_tail).
isaaclab = [
    "tensorboard>=2.14",
]

# LLM-facing MCP server entry point (the TCP client to the Kit bridge).
# The Kit-side socket server lives in exts/isaac.mcp.bridge/ and is loaded by Kit, not pip.
[project.scripts]
isaac-mcp = "isaac_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["isaac_mcp"]
