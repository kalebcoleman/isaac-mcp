[project]
name = "isaac-mcp"
version = "0.2.0"
description = "MCP server for Isaac Sim and Isaac Lab with desktop screen capture"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    # 1.22 is the lowest version tested with current Pydantic 2 releases.
    # Upper bound <2: mcp 2 renamed FastMCP to MCPServer and removed
    # `mcp.server.fastmcp`, which isaac_mcp/server.py imports.
    # The installed version is the one in uv.lock. `uv sync --locked` and
    # `uv run --locked` use that file. `uv tool install` does not.
    "mcp[cli]>=1.22,<2",
    # Older supported MCP releases do not constrain HTTPX 1.x, whose API breaks them.
    "httpx>=0.27.1,<1",
    # Host-side screen tools (isaac_mcp/screen.py).
    "mss>=10.0",
    "pillow>=10.1",
    "python-xlib>=0.33",
    "imageio-ffmpeg>=0.5",
]

# What the host tests need (`pip install -e '.[test]'`).
[project.optional-dependencies]
test = [
    "pytest",
    "pyyaml",  # RViz config validity in test_ros2_tools.py
]
scene-test = ["usd-core>=25.11,<27", "numpy"]  # numpy: occupancy-map tests
# Isaac Lab tool pack: TensorBoard event-file readout (isaaclab__metrics_*, isaaclab__tensorboard_tail).
isaaclab = [
    "tensorboard>=2.14",
]

# LLM-facing MCP server entry point (the TCP client to the Kit bridge).
# The Kit-side socket server lives in exts/isaac.mcp.bridge/ and is loaded by Kit, not pip.
[project.scripts]
isaac-mcp = "isaac_mcp.server:main"

# Keep this project's resolver independent of the repository-root simulator
# project, which sets prerelease = "allow" and pins the Isaac Sim stack.
# `if-necessary` is uv's default: a pre-release is used only when a requirement
# asks for one. `uv lock` and `uv sync --locked` then match from this directory
# alone and from the repository root.
[tool.uv]
prerelease = "if-necessary"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["isaac_mcp"]
