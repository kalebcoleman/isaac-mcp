# Old names that may stay in tracked files, each with the reason. scripts/check_names.py --enforce fails on every
# other hit, on an entry that matches nothing, and on an entry whose "remove_by" version has been reached.
# "pattern" is a name from check_names.py's PATTERNS, or "*" for all of them; "literal" limits an entry to one spelling.

# --- Upstream project names, licences and provenance

[[allow]]
pattern = "isaac-sim-mcp"
path = "*"
reason = "Name of the upstream project this one grew from: attribution, vendoring record and licence text must keep it."

[[allow]]
pattern = "omni-kit-mcp"
path = "*"
reason = "Name of the upstream project this one grew from: attribution, vendoring record and licence text must keep it."

[[allow]]
pattern = "husarion"
path = "THIRD-PARTY-NOTICES.md"
reason = "Third-party notice and licence record for the Husarion RG2 description."

[[allow]]
pattern = "husarion"
path = "docs/provenance/*"
reason = "Licence file of the Husarion RG2 description."

[[allow]]
pattern = "husarion"
path = "docs/VENDORING.md"
reason = "Provenance record: which third-party files the lab assets contain."

[[allow]]
pattern = "husarion"
path = "exts/workcell/workcell/*"
reason = "The work cell's provenance notes: it uses the standard OnRobot RG2, not the Husarion model, and refuses that model."

[[allow]]
pattern = "husarion"
path = "mcp/tests/test_workcell_*.py"
reason = "Tests that the work cell refuses the Husarion RG2 model."

# --- The checks themselves must spell the names they look for

[[allow]]
pattern = "*"
path = "scripts/check_names.py"
reason = "The naming guard spells the names it detects."

[[allow]]
pattern = "*"
path = "mcp/tests/test_check_names.py"
reason = "The guard's test fixture spells the names it detects."

[[allow]]
pattern = "*"
path = "scripts/name_allowlist.toml"
reason = "The exceptions spell the names they permit."

[[allow]]
pattern = "physx-release"
path = "scripts/check_docs.py"
reason = "The documentation check lists the retired sentences it reports."

[[allow]]
pattern = "newton-experimental"
path = "scripts/check_docs.py"
reason = "The documentation check lists the retired sentences it reports."
