name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-checks:
    name: CPU-only host checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check documentation
        run: python3 scripts/check_docs.py

      - name: Check bundled asset licences
        run: python3 scripts/check_assets.py

      - name: Check packaged UR5e catalog
        run: python3 scripts/gen_host_catalog.py --check

      - name: Run host test suite (Python 3.12)
        working-directory: mcp
        run: uv run --isolated --python 3.12 --with-editable . --extra test --extra isaaclab --extra scene-test pytest -q

      - name: Check minimum supported MCP SDK
        working-directory: mcp
        run: uv run --no-project --python 3.12 --with-editable '.[test,isaaclab]' --with 'mcp[cli]==1.22.0' pytest -q tests/test_packaging.py tests/test_tool_groups.py tests/test_desktop_input.py tests/test_sim_sessions.py tests/test_screen_windows.py tests/test_check_docs.py tests/test_host_catalog_gateway.py tests/test_scene_gateway.py tests/test_project_assets.py

      - name: Build wheel and sdist
        working-directory: mcp
        run: uv build

      - name: Validate npm package contents
        working-directory: npm
        run: npm pack --dry-run
